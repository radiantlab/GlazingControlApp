name: ci

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: svc/.python-version

      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.17"

      - name: Install dependencies
        working-directory: ./svc
        run: uv sync --frozen

      - name: Run tests
        working-directory: ./svc
        run: uv run pytest tests/ -v

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./web
        run: npm ci

      - name: Run frontend lint and format check
        working-directory: ./web
        run: npm run lint

      - name: Run frontend tests
        working-directory: ./web
        run: npm run test

      - name: Run frontend typecheck
        working-directory: ./web
        run: npm run typecheck

      - name: Build frontend
        working-directory: ./web
        run: npm run build

  powershell-tests:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The suite uses Pester 3 syntax and launches powershell.exe, so it runs
      # under Windows PowerShell 5.1 with the Pester 3.4.0 that ships with it.
      # Actions sets $ErrorActionPreference to Stop, which turns the stderr the
      # tests capture with 2>&1 into exceptions; run them with the default.
      - name: Run Pester tests
        shell: powershell
        run: |
          Import-Module Pester -RequiredVersion 3.4.0
          $ErrorActionPreference = 'Continue'
          Invoke-Pester -Path scripts/sensors/tests -EnableExit
