# Weekly dependency updates. Each ecosystem is grouped so a week produces at
# most one PR per ecosystem; CI (backend-tests, frontend-checks, docker-builds)
# must pass before any of them can merge.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      web:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /svc
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      svc:
        patterns: ["*"]

  # Base images in the Dockerfile. The uv pin (COPY --from=ghcr.io/astral-sh/uv)
  # and setup-uv's version in ci.yml are bumped by hand, together.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      images:
        patterns: ["*"]
