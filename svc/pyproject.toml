[project]
name = "glazing-control-service"
version = "0.1.0"
description = "DIAL Control Center backend: electrochromic glazing control and sensor acquisition"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "pydantic==2.13.5",
    "httpx==0.28.1",
    "python-dotenv==1.2.4",
    "requests==2.34.2",
    "pyserial>=3.5",
    "numpy==2.4.6",
    "scipy==1.17.1",
    "colour-science==0.4.7",
    "pymodbus==3.15.0",
    "tzdata>=2025.2",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
