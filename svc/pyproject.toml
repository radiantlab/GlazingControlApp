[project]
name = "glazing-control-service"
version = "0.1.0"
description = "DIAL Control Center backend: electrochromic glazing control and sensor acquisition"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "pyserial>=3.5",
    "numpy>=2.5.3",
    "scipy>=1.18.1",
    "colour-science>=0.4.7",
    "pymodbus>=3.15.0",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    # starlette.testclient (used by FastAPI's TestClient) imports httpx2.
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
